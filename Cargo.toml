[package]
name = "elevate-ti"
version = "0.2.1"
edition = "2024"
description = "A safe, idiomatic Rust library to obtain Windows TrustedInstaller privileges"
repository = "https://github.com/Z7K9T2Y5X8V4N1Q6P0M3L8R2S9W5H1G7J4D6C0F/elevate-ti"
license = "MIT OR Apache-2.0"
keywords = ["elevation", "privilege", "security", "trustedinstaller", "windows"]
categories = ["development-tools", "os::windows-apis"]

[package.metadata.docs.rs]
default-target = "x86_64-pc-windows-msvc"
targets = ["x86_64-pc-windows-msvc"]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

[dependencies]
thiserror = "2.0"

[dependencies.windows]
version = "0.58"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Environment",
  "Win32_System_Services",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

[lints.clippy]
all = { level = "deny", priority = -1 }
cast_possible_truncation = "allow"
missing_errors_doc = "allow"
must_use_candidate = "allow"
pedantic = { level = "warn", priority = -1 }

[lints.rust]
missing_docs = "warn"
warnings = "deny"
