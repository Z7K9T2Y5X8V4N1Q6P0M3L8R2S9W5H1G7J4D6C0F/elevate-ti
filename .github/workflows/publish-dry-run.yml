name: Publish dry run

on:
  workflow_dispatch:
  pull_request:

jobs:
  dry-run:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Test
        run: cargo test --locked

      - name: Dry run
        run: cargo publish --dry-run --locked
